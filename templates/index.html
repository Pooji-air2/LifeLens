<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLens</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body style="background: linear-gradient(to right, #667eea, #764ba2);">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="col-md-6">

        <!-- Card -->
        <div class="card shadow-lg p-4 rounded-4">

            <h2 class="text-center mb-4">🌟 LifeLens</h2>

            <!-- FORM -->
            <form method="post">

                <div class="mb-3">
                    <label class="form-label">📚 Study Hours</label>
                    <input type="number" class="form-control" name="study" placeholder="Enter study hours" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">😴 Sleep Hours</label>
                    <input type="number" class="form-control" name="sleep" placeholder="Enter sleep hours" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">📱 Screen Time (hrs)</label>
                    <input type="number" class="form-control" name="screen" placeholder="Enter screen time" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">🏋️ Workout</label>
                    <select class="form-select" name="workout">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">🌅 Morning Routine</label>
                    <select class="form-select" name="morning">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <button class="btn btn-primary w-100">🚀 Analyze Life</button>

            </form>
        </div>

        <!-- RESULT -->
        {% if score %}
        <div class="card mt-4 shadow-lg p-4 rounded-4 text-center bg-white">

            <h3>📊 Life Score</h3>
            <h1 class="text-primary">{{ score }}/100</h1>

            <p class="mt-3">{{ suggestion }}</p>

        </div>
        {% endif %}

        <!-- WORKOUT PLAN -->
        {% if workout_plan %}
        <div class="card mt-4 shadow-lg p-4 rounded-4 bg-white">

            <h4>🏋️ Your Workout Plan</h4>

            <ul class="mt-3">
                {% for item in workout_plan %}
                <li>{{ item }}</li>
                {% endfor %}
            </ul>

        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
